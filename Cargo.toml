[package]
name = "audiochaos"
description = "A modular synthesizer for chaotic, aggressive sounds, standalone or as a VST3/CLAP plugin"
readme = "README.md"
keywords = ["synthesizer", "audio", "modular", "music", "dsp"]
categories = ["multimedia::audio"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: the library exists for the program and the plugin.
publish = false

[workspace]
members = ["plugin", "xtask"]

# Shared by every crate of the workspace, so a release bumps one version.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cscdpn/audiochaos"

[features]
default = ["app"]
# The node editor, without a window of its own: the DAW plugin draws it in
# the host's window.
editor = ["dep:egui", "dep:egui-snarl", "dep:rfd"]
# The standalone program: sound card, MIDI ports, its own window, the
# terminal UI.
app = ["editor", "dep:cpal", "dep:eframe", "dep:midir", "dep:ratatui"]
# Low latency on Windows, through the sound cards' ASIO drivers. Off by
# default: the build needs LLVM and downloads Steinberg's ASIO SDK, whose
# licence (GPLv3 or Steinberg's own) then covers the program built.
asio = ["app", "cpal/asio"]

[[bin]]
name = "audiochaos"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
# realtime: the audio thread gets real-time priority where cpal can give it
# safely, that is in low latency (ALSA hardware devices, through RealtimeKit
# over D-Bus, so no special user rights) and with WASAPI.
cpal = { version = "0.18.2", optional = true, features = ["realtime-dbus"] }
# Pinned to 0.36: egui-snarl 0.12 is built on egui 0.36, and so is
# nice-plug-egui 0.5, which draws the editor in the plugin. The glow
# (OpenGL) backend instead of the default wgpu: plenty for 2D blocks and
# sliders, and far fewer dependencies to compile.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }
egui = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
], optional = true }
egui-snarl = { version = "0.12.0", optional = true }
hound = "3.5.1"
midir = { version = "0.11.1", optional = true }
ratatui = { version = "0.30.2", optional = true }
rfd = { version = "0.17.2", optional = true }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Unoptimized DSP is too slow: the stability tests take ~40 s and debug
# builds risk audio dropouts. Light optimization keeps debugging usable.
[profile.dev]
opt-level = 1
