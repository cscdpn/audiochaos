[package]
name = "audiochaos"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
# Pinned to 0.36: egui-snarl 0.12 is built on egui 0.36. The glow (OpenGL)
# backend instead of the default wgpu: plenty for 2D blocks and sliders, and
# far fewer dependencies to compile.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-snarl = "0.12.0"
hound = "3.5.1"
midir = "0.11.1"
ratatui = "0.30.2"
rfd = "0.17.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Unoptimized DSP is too slow: the stability tests take ~40 s and debug
# builds risk audio dropouts. Light optimization keeps debugging usable.
[profile.dev]
opt-level = 1
